[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-utils"
version = "0.1.4"
description = "Utilities for coding agents: agterm project launch, skills, instructions"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[project.scripts]
agents = "agent_utils.entry:entrypoint"

[tool.setuptools.packages.find]
include = ["agent_utils*"]

[tool.setuptools.package-data]
"agent_utils.core" = ["*.md", "*.ts", "*.js", "snippet_library/*.md"]
"agent_utils.agterm" = ["*.ts"]
"agent_utils.core.setup" = ["*.zsh"]
